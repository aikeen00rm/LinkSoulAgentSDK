[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linksoul-studio"
version = "0.1.0"
description = "A3 Ultra connection console"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.121.3", "uvicorn==0.38.0", "Jinja2==3.1.6", "linksoul-agentsdk==1.5.0a1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linksoul_studio = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
