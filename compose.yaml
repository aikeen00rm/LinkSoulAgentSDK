name: linksoul-studio-v2
services:
  studio:
    image: linksoul-studio-v2:0.2.0
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    env_file:
      - path: .env
        required: false
    environment:
      STUDIO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8000}:8000"
    volumes:
      - studio-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  studio-data:
    name: linksoul-studio-v2-data
